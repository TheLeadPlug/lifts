<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON">
<meta name="theme-color" content="#0d0d0d">
<title>IRON — Lift Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --bg2: #111;
  --plate: #181818;
  --plate2: #202020;
  --chalk: #2a2a2a;
  --wire: #333;
  --smoke: #555;
  --fog: #888;
  --light: #d8d8d0;
  --white: #f0efe8;
  --fire: #ff4018;
  --ember: #ff6a3d;
  --steel: #4fa8c5;
  --lime: #a8e040;
  --gold: #f0b429;
  --font-display: 'Bebas Neue', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --font-body: 'DM Sans', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--white); font-family:var(--font-body); }

/* noise texture overlay */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.6;
}

.screen { display:none; position:fixed; inset:0; flex-direction:column; background:var(--bg); z-index:1; }
.screen.active { display:flex; }

/* ── NAV ── */
.bnav {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:var(--bg2); border-top:1px solid var(--chalk);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
.nb {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:10px 0; background:none; border:none; color:var(--smoke);
  font-family:var(--font-display); font-size:11px; letter-spacing:.12em; cursor:pointer;
  transition:color .15s; position:relative;
}
.nb svg { width:20px; height:20px; }
.nb.active { color:var(--fire); }
.nb.active::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:32px; height:2px; background:var(--fire); border-radius:0 0 2px 2px;
}

/* ── SCROLLABLE CONTENT ── */
.content { flex:1; overflow-y:auto; padding:14px 16px 100px; }
::-webkit-scrollbar { width:2px; }
::-webkit-scrollbar-thumb { background:var(--chalk); }

/* ── SCREEN HEADERS ── */
.sh {
  padding:48px 16px 12px; position:sticky; top:0;
  background:var(--bg); z-index:10; border-bottom:1px solid var(--chalk);
}
.sh-row { display:flex; align-items:flex-end; justify-content:space-between; }
.page-eyebrow { font-family:var(--font-mono); font-size:10px; color:var(--smoke); letter-spacing:.15em; text-transform:uppercase; margin-bottom:2px; }
.page-title { font-family:var(--font-display); font-size:48px; line-height:.9; letter-spacing:.02em; color:var(--white); }

/* ── SHARED ELEMENTS ── */
.tag {
  display:inline-flex; align-items:center;
  font-family:var(--font-display); font-size:13px; letter-spacing:.1em;
  padding:3px 10px; border-radius:2px;
}
.tag-fire { background:var(--fire); color:var(--white); }
.tag-steel { background:var(--steel); color:var(--bg); }
.tag-lime { background:var(--lime); color:var(--bg); }
.tag-gold { background:var(--gold); color:var(--bg); }
.tag-outline { background:transparent; border:1px solid var(--chalk); color:var(--fog); }

/* thick left-border cards — the signature element */
.plate-card {
  background:var(--plate); border-left:3px solid var(--chalk);
  border-radius:0 6px 6px 0; overflow:hidden; margin-bottom:10px;
  position:relative;
}
.plate-card.accent-fire { border-left-color:var(--fire); }
.plate-card.accent-steel { border-left-color:var(--steel); }
.plate-card.accent-lime { border-left-color:var(--lime); }
.plate-card.accent-gold { border-left-color:var(--gold); }
.plate-card.accent-smoke { border-left-color:var(--smoke); }

/* dividers */
.div { height:1px; background:var(--chalk); margin:0; }

/* ── BUTTONS ── */
.btn-fire {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:16px; border:none; border-radius:4px;
  background:var(--fire); color:var(--white);
  font-family:var(--font-display); font-size:22px; letter-spacing:.08em;
  cursor:pointer; transition:all .15s;
}
.btn-fire:active { transform:scale(.98); filter:brightness(.85); }
.btn-ghost {
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 16px; border:1px solid var(--chalk); border-radius:4px;
  background:transparent; color:var(--fog);
  font-family:var(--font-display); font-size:14px; letter-spacing:.08em;
  cursor:pointer; transition:all .15s;
}
.btn-ghost:active { border-color:var(--fog); color:var(--white); }
.btn-danger {
  display:flex; align-items:center; justify-content:center;
  width:100%; padding:12px; border:1px solid var(--fire); border-radius:4px;
  background:transparent; color:var(--fire);
  font-family:var(--font-display); font-size:16px; letter-spacing:.08em;
  cursor:pointer; margin-top:10px;
}

/* inputs */
input[type=text], input[type=number], textarea, select {
  background:var(--plate2); border:1px solid var(--chalk); border-radius:4px;
  color:var(--white); font-family:var(--font-body); font-size:15px;
  padding:10px 12px; width:100%; outline:none; -webkit-appearance:none;
}
input:focus, textarea:focus { border-color:var(--fire); }
input[type=number] { -moz-appearance:textfield; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
textarea { resize:none; line-height:1.6; }

/* icon buttons */
.icon-btn {
  background:none; border:none; color:var(--smoke); cursor:pointer;
  padding:5px; display:flex; align-items:center; border-radius:3px;
  transition:color .12s;
}
.icon-btn:active { color:var(--white); }
.icon-btn.danger:active { color:var(--fire); }

/* ══════════════════════════════════════════
   HOME SCREEN
══════════════════════════════════════════ */
.home-logo {
  font-family:var(--font-display); font-size:72px; line-height:.85;
  letter-spacing:.04em; color:var(--white); position:relative; display:inline-block;
}
.home-logo span { color:var(--fire); }
.home-tagline { font-family:var(--font-mono); font-size:10px; color:var(--smoke); letter-spacing:.2em; margin-top:6px; }

/* cycle nav */
.cyc { display:flex; align-items:center; gap:6px; margin:16px 0 12px; }
.ca {
  width:34px; height:34px; border-radius:3px; background:var(--plate);
  border:1px solid var(--chalk); color:var(--fog); font-size:20px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.ca:active { background:var(--plate2); color:var(--white); }
.cdots { display:flex; gap:4px; flex:1; justify-content:center; }
.cd {
  flex:1; max-width:44px; height:34px; border-radius:3px; border:1px solid var(--chalk);
  background:var(--plate); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:16px; color:var(--smoke); cursor:pointer;
  transition:all .15s; letter-spacing:.05em;
}
.cd.active { background:var(--fire); color:var(--white); border-color:var(--fire); }
.cd.logged { border-color:var(--lime); color:var(--lime); }
.cd.inprog { border-color:var(--gold); color:var(--gold); }

/* today card */
.today-block { margin-bottom:12px; }
.today-meta { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.today-day-num {
  font-family:var(--font-display); font-size:80px; line-height:.85;
  color:var(--chalk); margin-right:4px; flex-shrink:0;
}
.today-info { flex:1; }
.today-day-label { font-family:var(--font-mono); font-size:10px; color:var(--smoke); letter-spacing:.15em; text-transform:uppercase; }
.today-day-name { font-family:var(--font-display); font-size:38px; line-height:1; }

.lift-list { display:flex; flex-direction:column; gap:4px; }
.lift-list-row {
  display:flex; align-items:center; padding:8px 12px;
  background:var(--plate); border-left:2px solid var(--chalk);
  border-radius:0 4px 4px 0;
}
.ll-name { font-size:13px; font-weight:500; flex:1; color:var(--light); }
.ll-scheme { font-family:var(--font-mono); font-size:11px; color:var(--smoke); margin-right:8px; }
.ll-prev { font-family:var(--font-mono); font-size:11px; color:var(--fog); }

/* stat cards */
.stat-strip { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:12px; }
.stat-block {
  background:var(--plate); border-top:2px solid var(--chalk);
  padding:10px 10px 12px; border-radius:0 0 4px 4px;
}
.stat-block.hot { border-top-color:var(--fire); }
.stat-num { font-family:var(--font-display); font-size:30px; line-height:1; color:var(--white); }
.stat-num.fire { color:var(--fire); }
.stat-label { font-family:var(--font-mono); font-size:9px; color:var(--smoke); letter-spacing:.12em; text-transform:uppercase; margin-top:2px; }

/* start btn */
.start-btn {
  display:flex; align-items:center; gap:10px;
  padding:14px 18px; border:none; border-radius:4px;
  font-family:var(--font-display); font-size:20px; letter-spacing:.08em;
  cursor:pointer; transition:all .15s; flex-shrink:0;
}
.start-btn:active { transform:scale(.96); }

/* ══════════════════════════════════════════
   WORKOUT SCREEN
══════════════════════════════════════════ */
.wk-header-meta { display:flex; align-items:center; justify-content:space-between; }
.wk-day-tag { font-family:var(--font-mono); font-size:10px; color:var(--smoke); letter-spacing:.15em; }
.wk-name { font-family:var(--font-display); font-size:44px; line-height:.9; }
.progress-strip { height:4px; background:var(--chalk); margin-top:10px; border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--fire); transition:width .4s; border-radius:2px; }

/* lift blocks */
.lift-block {
  background:var(--plate); border-left:3px solid var(--chalk);
  border-radius:0 6px 6px 0; margin-bottom:10px; overflow:hidden;
}
.lift-block.done-block { border-left-color:var(--lime); }
.lift-hdr { padding:12px 14px 10px; display:flex; align-items:flex-start; gap:8px; }
.lift-hdr-left { flex:1; min-width:0; }
.lift-name {
  font-family:var(--font-display); font-size:22px; line-height:1;
  color:var(--white); cursor:pointer; letter-spacing:.02em;
}
.lift-name-inp {
  font-family:var(--font-display); font-size:22px; background:transparent;
  border:none; border-bottom:2px solid var(--fire); color:var(--white);
  outline:none; width:100%; padding:0; letter-spacing:.02em;
}
.lift-scheme { font-family:var(--font-mono); font-size:11px; color:var(--smoke); margin-top:2px; }
.lift-hdr-right { display:flex; gap:2px; }
.done-tag { font-family:var(--font-display); font-size:14px; color:var(--lime); letter-spacing:.06em; }

/* last week reference */
.lw-bar {
  padding:6px 14px; background:var(--bg2); border-top:1px solid var(--chalk);
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.lw-label { font-family:var(--font-mono); font-size:9px; color:var(--smoke); letter-spacing:.12em; text-transform:uppercase; flex-shrink:0; }
.lw-chip {
  font-family:var(--font-mono); font-size:11px; color:var(--fog);
  background:var(--plate2); padding:2px 8px; border-radius:2px;
}

/* set rows */
.set-header {
  padding:4px 14px; display:grid;
  grid-template-columns:24px 1fr 1fr 30px 26px; gap:6px;
  border-top:1px solid var(--chalk);
}
.set-col-lbl { font-family:var(--font-mono); font-size:9px; color:var(--smoke); text-align:center; letter-spacing:.1em; text-transform:uppercase; }
.set-row {
  display:grid; grid-template-columns:24px 1fr 1fr 30px 26px;
  align-items:center; gap:6px; padding:7px 14px;
  border-top:1px solid var(--chalk); transition:background .12s;
}
.set-row.done-row { background:rgba(168,224,64,.04); }
.set-num { font-family:var(--font-mono); font-size:12px; color:var(--smoke); text-align:center; }
.si {
  background:var(--plate2); border:1px solid var(--chalk); border-radius:3px;
  color:var(--white); font-family:var(--font-display); font-size:20px;
  padding:8px 6px; text-align:center; width:100%; outline:none; letter-spacing:.02em;
}
.si:focus { border-color:var(--fire); }
.si.pre { color:var(--smoke); }
.si[type=number] { -moz-appearance:textfield; }
.si[type=number]::-webkit-inner-spin-button,
.si[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
.ck {
  width:28px; height:28px; border-radius:50%;
  border:2px solid var(--chalk); background:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.ck.on { background:var(--lime); border-color:var(--lime); }
.ck svg { width:13px; height:13px; }
.del-set-btn {
  background:none; border:none; color:var(--chalk); cursor:pointer;
  display:flex; align-items:center; padding:3px; border-radius:3px;
  transition:color .12s;
}
.del-set-btn:active { color:var(--fire); }

/* add set */
.add-set-row {
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:10px; border-top:1px solid var(--chalk); background:none; border:none;
  width:100%; color:var(--smoke); font-family:var(--font-display); font-size:14px;
  letter-spacing:.08em; cursor:pointer; border-top:1px solid var(--chalk);
}
.add-set-row:active { color:var(--white); }

/* session note */
.session-note-wrap { margin-bottom:10px; }
.snote-label {
  font-family:var(--font-display); font-size:13px; letter-spacing:.1em;
  color:var(--smoke); text-transform:uppercase; margin-bottom:6px;
  display:flex; align-items:center; gap:8px;
}
.snote-label::after { content:''; flex:1; height:1px; background:var(--chalk); }

/* add lift */
.add-lift-row {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px; width:100%; background:none; border:1px dashed var(--chalk);
  border-radius:4px; color:var(--smoke); font-family:var(--font-display);
  font-size:15px; letter-spacing:.1em; cursor:pointer; margin-top:4px;
  transition:all .15s;
}
.add-lift-row:active { border-color:var(--fire); color:var(--fire); }

/* finish bar */
.fb { position:sticky; bottom:70px; padding:10px 16px; z-index:50; background:linear-gradient(transparent, var(--bg) 50%); }

/* ══════════════════════════════════════════
   HISTORY
══════════════════════════════════════════ */
.hist-card {
  background:var(--plate); border-left:3px solid var(--chalk);
  border-radius:0 6px 6px 0; padding:14px; margin-bottom:8px; cursor:pointer;
  transition:border-left-color .15s;
}
.hist-card:active { background:var(--plate2); }
.hist-meta { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.hist-date { font-family:var(--font-mono); font-size:10px; color:var(--smoke); letter-spacing:.12em; }
.hist-name { font-family:var(--font-display); font-size:26px; line-height:1; margin-top:2px; }
.hist-stats { display:flex; gap:14px; margin-top:6px; }
.hist-stat { font-family:var(--font-mono); font-size:11px; color:var(--smoke); }
.hist-stat strong { color:var(--light); font-weight:500; }

/* ══════════════════════════════════════════
   PROGRESS
══════════════════════════════════════════ */
.lift-pills { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.lift-pill {
  padding:7px 14px; border-radius:3px; background:var(--plate);
  border:1px solid var(--chalk); font-family:var(--font-display);
  font-size:14px; letter-spacing:.06em; cursor:pointer; transition:all .15s;
  color:var(--fog);
}
.lift-pill.active { background:var(--fire); color:var(--white); border-color:var(--fire); }
.pr-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.pr-block { background:var(--plate); border-top:2px solid var(--fire); padding:12px; border-radius:0 0 4px 4px; }
.pr-block.steel { border-top-color:var(--steel); }
.pr-val { font-family:var(--font-display); font-size:36px; line-height:1; color:var(--white); }
.pr-lbl { font-family:var(--font-mono); font-size:9px; color:var(--smoke); letter-spacing:.12em; text-transform:uppercase; margin-top:3px; }
.chart-block { background:var(--plate); border-radius:4px; padding:14px; margin-bottom:8px; }
.chart-title { font-family:var(--font-display); font-size:14px; letter-spacing:.1em; color:var(--smoke); margin-bottom:10px; }
.cw { width:100%; overflow-x:auto; }
svg.ch { display:block; }

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
.mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; align-items:flex-end; }
.mo.open { display:flex; }
.modal {
  background:var(--bg2); border-top:2px solid var(--fire);
  padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  width:100%; max-height:88vh; overflow-y:auto; position:relative;
}
.modal-close {
  position:absolute; top:16px; right:16px;
  background:var(--plate); border:1px solid var(--chalk); border-radius:50%;
  width:28px; height:28px; color:var(--fog); font-size:16px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.modal-session-name { font-family:var(--font-display); font-size:36px; line-height:1; margin-bottom:4px; }
.modal-session-date { font-family:var(--font-mono); font-size:10px; color:var(--smoke); letter-spacing:.15em; margin-bottom:4px; }
.modal-session-note { font-size:13px; color:var(--fog); font-style:italic; margin-bottom:16px; line-height:1.6; border-left:2px solid var(--chalk); padding-left:10px; }
.modal-lift { margin-bottom:16px; }
.modal-lift-name { font-family:var(--font-display); font-size:20px; letter-spacing:.04em; margin-bottom:6px; }
.modal-set-row { display:flex; gap:12px; padding:5px 0; border-bottom:1px solid var(--chalk); font-family:var(--font-mono); font-size:12px; color:var(--smoke); }
.modal-set-row:last-child { border:none; }
.modal-set-row strong { color:var(--light); font-weight:500; }
.modal-best { font-family:var(--font-mono); font-size:11px; color:var(--fire); padding:4px 0 2px; letter-spacing:.08em; }

/* ══════════════════════════════════════════
   CUSTOM DIALOGS (replaces prompt/confirm)
══════════════════════════════════════════ */
.dialog-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.92);
  z-index:500; align-items:flex-end;
}
.dialog-overlay.open { display:flex; }
.dialog-sheet {
  background:var(--bg2); border-top:2px solid var(--fire);
  padding:20px 16px calc(24px + env(safe-area-inset-bottom));
  width:100%;
}
.dialog-title {
  font-family:var(--font-display); font-size:22px; letter-spacing:.06em;
  margin-bottom:14px; color:var(--white);
}
.dialog-input {
  background:var(--plate); border:1px solid var(--chalk); border-radius:4px;
  color:var(--white); font-family:var(--font-body); font-size:16px;
  padding:12px 14px; width:100%; outline:none; margin-bottom:12px;
  -webkit-appearance:none;
}
.dialog-input:focus { border-color:var(--fire); }
.dialog-btns { display:flex; gap:8px; }
.dialog-btn-ok {
  flex:1; padding:14px; border:none; border-radius:4px;
  background:var(--fire); color:var(--white);
  font-family:var(--font-display); font-size:18px; letter-spacing:.08em; cursor:pointer;
}
.dialog-btn-ok:active { filter:brightness(.85); }
.dialog-btn-cancel {
  flex:1; padding:14px; border:1px solid var(--chalk); border-radius:4px;
  background:transparent; color:var(--fog);
  font-family:var(--font-display); font-size:18px; letter-spacing:.08em; cursor:pointer;
}
.dialog-btn-cancel:active { border-color:var(--fog); color:var(--white); }

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
.toast {
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(12px);
  background:var(--plate); border:1px solid var(--chalk); border-left:3px solid var(--fire);
  border-radius:0 4px 4px 0; padding:10px 16px;
  font-family:var(--font-display); font-size:15px; letter-spacing:.06em;
  opacity:0; transition:all .2s; z-index:999; white-space:nowrap; pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* empty state */
.es { text-align:center; padding:48px 20px; color:var(--smoke); }
.es-icon { font-size:48px; margin-bottom:12px; }
.es p { font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="sh">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--smoke);letter-spacing:.1em;" id="todayDate"></div>
    </div>
  </div>
  <div class="content">
    <div class="cyc" id="cycNav"></div>
    <div id="todayCard"></div>
    <div class="stat-strip" id="statsRow"></div>
  </div>
</div>

<!-- WORKOUT -->
<div id="workout" class="screen">
  <div class="sh">
    <div class="wk-header-meta">
      <div>
        <div class="wk-day-tag" id="wkLabel"></div>
        <div class="wk-name" id="wkTitle"></div>
      </div>
      <button class="btn-ghost btn-sm" onclick="cancelWorkout()" style="font-size:13px;padding:8px 14px;">CANCEL</button>
    </div>
    <div class="progress-strip"><div class="progress-fill" id="progBar" style="width:0%"></div></div>
  </div>
  <div class="content" id="wkContent"></div>
  <div class="fb"><button class="btn-fire" onclick="finishWorkout()">FINISH SESSION</button></div>
</div>

<!-- HISTORY -->
<div id="history" class="screen">
  <div class="sh">
    <div class="page-eyebrow">All Sessions</div>
    <div class="page-title">HISTORY</div>
  </div>
  <div class="content" id="histContent"></div>
</div>

<!-- PROGRESS -->
<div id="progress" class="screen">
  <div class="sh">
    <div class="page-eyebrow">Analytics</div>
    <div class="page-title">PROGRESS</div>
  </div>
  <div class="content" id="progContent"></div>
</div>

<!-- NAV -->
<nav class="bnav">
  <button class="nb active" onclick="go('home')" id="nav-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    HOME
  </button>
  <button class="nb" onclick="go('workout')" id="nav-workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 3a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12z"/><path d="M6 8v8"/><path d="M18 8v8"/><path d="M4 12h2"/><path d="M18 12h2"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
    LOG
  </button>
  <button class="nb" onclick="go('history')" id="nav-history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    HISTORY
  </button>
  <button class="nb" onclick="go('progress')" id="nav-progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    GAINS
  </button>
</nav>

<!-- SESSION MODAL -->
<div class="mo" id="sesModal" onclick="if(event.target.id==='sesModal')closeMod()">
  <div class="modal">
    <button class="modal-close" onclick="closeMod()">&#215;</button>
    <div id="sesModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- PROMPT DIALOG (replaces native prompt) -->
<div class="dialog-overlay" id="promptDialog">
  <div class="dialog-sheet">
    <div class="dialog-title" id="promptTitle">ADD LIFT</div>
    <input class="dialog-input" id="promptInput" type="text" maxlength="60" placeholder="Lift name...">
    <div class="dialog-btns">
      <button class="dialog-btn-cancel" onclick="closePromptDialog()">CANCEL</button>
      <button class="dialog-btn-ok" onclick="submitPromptDialog()">ADD</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG (replaces native confirm) -->
<div class="dialog-overlay" id="confirmDialog">
  <div class="dialog-sheet">
    <div class="dialog-title" id="confirmTitle">ARE YOU SURE?</div>
    <div class="dialog-btns">
      <button class="dialog-btn-cancel" onclick="closeConfirmDialog(false)">NO</button>
      <button class="dialog-btn-ok" onclick="closeConfirmDialog(true)">YES</button>
    </div>
  </div>
</div>

<script>
// ─── PROGRAM ─────────────────────────────────────────────────────────────────
var PROG = { days: [
  { id:'upper-a', label:'UPPER A', type:'upper', color:'steel', lifts:[
    {name:'Barbell Bench Press', scheme:'5x3-5', sets:2},
    {name:'Incline DB Press',    scheme:'4x6-8', sets:2},
    {name:'Weighted Pull-Up',    scheme:'4x5-6', sets:2},
    {name:'Seated DB Shoulder Press', scheme:'3x8-10', sets:2},
    {name:'Cable Lateral Raise', scheme:'3x12-15', sets:2},
    {name:'Tricep Pressdown',    scheme:'3x10-12', sets:2},
    {name:'Incline DB Curl',     scheme:'3x10-12', sets:2}
  ]},
  { id:'lower-a', label:'LOWER A', type:'lower', color:'lime', lifts:[
    {name:'Barbell Back Squat',    scheme:'5x3-5', sets:2},
    {name:'Leg Press',             scheme:'4x8-10', sets:2},
    {name:'Bulgarian Split Squat', scheme:'3x8-10/leg', sets:2},
    {name:'Leg Extension',         scheme:'3x12-15', sets:2},
    {name:'Seated Leg Curl',       scheme:'3x10-12', sets:2},
    {name:'Standing Calf Raise',   scheme:'4x12-15', sets:2}
  ]},
  { id:'rest1', label:'REST', type:'rest', color:null, lifts:[] },
  { id:'upper-b', label:'UPPER B', type:'upper', color:'gold', lifts:[
    {name:'Pendlay Row',               scheme:'4x6-8', sets:2},
    {name:'Chest-Supported Row',       scheme:'4x10-12', sets:2},
    {name:'DB Incline Press',          scheme:'4x10-12', sets:2},
    {name:'Cable Fly Low-to-High',     scheme:'3x12-15', sets:2},
    {name:'Face Pull',                 scheme:'3x15-20', sets:2},
    {name:'Hammer Curl',               scheme:'3x12-15', sets:2},
    {name:'Overhead Tricep Extension', scheme:'3x12-15', sets:2}
  ]},
  { id:'lower-b', label:'LOWER B', type:'lower', color:'fire', lifts:[
    {name:'Romanian Deadlift', scheme:'4x6-8', sets:2},
    {name:'Lying Leg Curl',    scheme:'4x10-12', sets:2},
    {name:'Hip Thrust',        scheme:'4x10-12', sets:2},
    {name:'Hack Squat',        scheme:'3x10-12', sets:2},
    {name:'Nordic Curl / GHR', scheme:'3x6-8', sets:2},
    {name:'Seated Calf Raise', scheme:'4x15-20', sets:2}
  ]},
  { id:'rest2', label:'REST', type:'rest', color:null, lifts:[] }
]};

var COLOR_CSS = { steel:'var(--steel)', lime:'var(--lime)', gold:'var(--gold)', fire:'var(--fire)' };

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function loadD() {
  try {
    var r = localStorage.getItem('iron_v1');
    if (!r) return { sessions:[], curDay:0, names:{}, act:null };
    var d = JSON.parse(r);
    if (!d.names)    d.names    = {};
    if (!d.sessions) d.sessions = [];
    if (d.curDay === undefined) d.curDay = 0;
    return d;
  } catch(e) { return { sessions:[], curDay:0, names:{}, act:null }; }
}
function saveD() { D.act = ACT; localStorage.setItem('iron_v1', JSON.stringify(D)); }

var D   = loadD();
var ACT = D.act || null;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function lastSession(dayId) {
  for (var i = D.sessions.length-1; i >= 0; i--)
    if (D.sessions[i].dayId === dayId) return D.sessions[i];
  return null;
}
function prevW(name, si) {
  for (var i = D.sessions.length-1; i >= 0; i--) {
    var s = D.sessions[i];
    var l = s.lifts && s.lifts.find(function(x){ return x.name === name; });
    if (l && l.sets[si] && l.sets[si].w) return l.sets[si].w;
  }
  return '';
}
function colorCss(c) { return c && COLOR_CSS[c] ? COLOR_CSS[c] : 'var(--smoke)'; }

// ─── NAV ─────────────────────────────────────────────────────────────────────
function go(s) {
  if (document.getElementById('workout').classList.contains('active')) flushInputs();
  document.querySelectorAll('.screen').forEach(function(x){ x.classList.remove('active'); });
  document.querySelectorAll('.nb').forEach(function(x){ x.classList.remove('active'); });
  document.getElementById(s).classList.add('active');
  document.getElementById('nav-'+s).classList.add('active');
  if (s==='home')     rHome();
  else if (s==='workout')  rWorkout();
  else if (s==='history')  rHistory();
  else if (s==='progress') rProgress();
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function rHome() {
  var el = document.getElementById('todayDate');
  if (el) el.textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}).toUpperCase();
  rCyc(); rCard(); rStats();
}

function rCyc() {
  var el = document.getElementById('cycNav');
  var loggedIds = {};
  D.sessions.forEach(function(s){ loggedIds[s.dayId] = true; });
  var dots = PROG.days.map(function(d,i){
    var isA = i === D.curDay;
    var isL = loggedIds[d.id] && d.type !== 'rest';
    var isP = ACT && ACT.dayId === d.id;
    var lbl = d.type === 'rest' ? '&middot;' : String(i+1);
    var cls = 'cd' + (isA?' active':'') + (!isA&&isP?' inprog':'') + (!isA&&!isP&&isL?' logged':'');
    return '<div class="'+cls+'" onclick="jDay('+i+')" title="'+d.label+'">'+lbl+'</div>';
  }).join('');
  el.innerHTML = '<button class="ca" onclick="jDay((D.curDay+5)%6)">&#8249;</button><div class="cdots">'+dots+'</div><button class="ca" onclick="jDay((D.curDay+1)%6)">&#8250;</button>';
}

function jDay(i) { D.curDay = i; saveD(); rCyc(); rCard(); }

function rCard() {
  var el = document.getElementById('todayCard');
  var day = PROG.days[D.curDay];
  var clr = colorCss(day.color);

  if (day.type === 'rest') {
    el.innerHTML = '<div style="padding:20px 0 10px;">'
      + '<div style="font-family:var(--font-display);font-size:48px;color:var(--chalk);line-height:1;">DAY '+(D.curDay+1)+'</div>'
      + '<div style="font-family:var(--font-display);font-size:28px;color:var(--smoke);">REST &amp; RECOVER</div>'
      + '<div style="font-family:var(--font-mono);font-size:11px;color:var(--smoke);margin-top:8px;letter-spacing:.1em;">LIGHT CARDIO OPTIONAL — 30-45 MIN</div>'
      + '</div>';
    return;
  }

  var today   = new Date().toISOString().split('T')[0];
  var logged  = D.sessions.some(function(s){ return s.date===today && s.dayId===day.id; });
  var inProg  = ACT && ACT.dayId === day.id;
  var last    = lastSession(day.id);

  var ab = logged
    ? '<div class="tag tag-outline" style="border-color:var(--lime);color:var(--lime);">&#10003; DONE</div>'
    : inProg
      ? '<button class="start-btn" style="background:var(--gold);color:var(--bg);" onclick="go(\'workout\')">RESUME &#8594;</button>'
      : '<button class="start-btn" style="background:'+clr+';color:var(--bg);" onclick="startWorkout()">START &#8594;</button>';

  var rows = day.lifts.map(function(l) {
    var n = D.names[l.name] || l.name;
    var prev = '';
    if (last) {
      var pl = last.lifts.find(function(x){ return x.name===n; });
      if (pl) {
        var vs = pl.sets.filter(function(s){ return s.w&&s.r; });
        if (vs.length) {
          var best = vs.reduce(function(a,b){ return b.w>a.w?b:a; });
          prev = '<span class="ll-prev">'+best.w+'&times;'+best.r+'</span>';
        }
      }
    }
    return '<div class="lift-list-row" style="border-left-color:'+clr+';">'
      + '<span class="ll-name">'+esc(n)+'</span>'
      + '<span class="ll-scheme">'+esc(l.scheme)+'</span>'
      + prev
      + '</div>';
  }).join('');

  el.innerHTML = '<div style="padding:12px 0 8px;">'
    + '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;">'
    + '<div>'
    + '<div style="font-family:var(--font-mono);font-size:10px;color:'+clr+';letter-spacing:.15em;text-transform:uppercase;">DAY '+(D.curDay+1)+' OF 6</div>'
    + '<div style="font-family:var(--font-display);font-size:52px;line-height:.9;color:'+clr+';">'+day.label+'</div>'
    + '</div>'
    + ab
    + '</div>'
    + '<div class="lift-list">'+rows+'</div>'
    + '</div>';
}

function rStats() {
  var el = document.getElementById('statsRow');
  var sess = D.sessions.filter(function(s){ return s.type!=='rest'; });
  var best = 0, lastVol = 0;
  sess.forEach(function(s){
    s.lifts.forEach(function(l){
      l.sets.forEach(function(st){
        if (st.w&&st.r){ var e=Math.round(st.w*(1+st.r/30)); if(e>best) best=e; }
      });
    });
  });
  if (sess.length) {
    var ls = sess[sess.length-1];
    ls.lifts.forEach(function(l){ l.sets.forEach(function(st){ if(st.w&&st.r) lastVol+=st.w*st.r; }); });
  }
  el.innerHTML =
    '<div class="stat-block"><div class="stat-num">'+sess.length+'</div><div class="stat-label">Sessions</div></div>'
  + '<div class="stat-block hot"><div class="stat-num fire">'+(best?best+'lb':'&mdash;')+'</div><div class="stat-label">Best 1RM Est</div></div>'
  + '<div class="stat-block"><div class="stat-num">'+(lastVol?Math.round(lastVol/1000)+'k':'&mdash;')+'</div><div class="stat-label">Last Vol lb</div></div>';
}

// ─── WORKOUT ──────────────────────────────────────────────────────────────────
function startWorkout() {
  var day = PROG.days[D.curDay];
  ACT = {
    dayId: day.id, label: day.label, type: day.type, color: day.color,
    note: '',
    lifts: day.lifts.map(function(l) {
      var n = D.names[l.name] || l.name;
      return { name:n, scheme:l.scheme, sets: Array.from({length:l.sets}, function(_,i){ return {w:prevW(n,i), r:'', done:false}; }) };
    })
  };
  saveD(); go('workout');
}

function rWorkout() {
  var day = PROG.days[D.curDay];
  document.getElementById('wkTitle').textContent = day.label;
  document.getElementById('wkLabel').textContent = 'DAY '+(D.curDay+1)+' OF 6 \u2014 '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
  if (day.type === 'rest') {
    document.getElementById('wkContent').innerHTML = '<div class="es"><div class="es-icon">&#128564;</div><p>REST DAY<br>RECOVERY IS TRAINING</p></div>';
    document.querySelector('.fb').style.display = 'none'; return;
  }
  document.querySelector('.fb').style.display = 'block';
  if (!ACT || ACT.dayId !== day.id) {
    document.getElementById('wkContent').innerHTML = '<div class="es"><p>GO TO HOME TO<br>START THIS SESSION</p></div>';
    document.querySelector('.fb').style.display = 'none'; return;
  }
  updProg(); rWkContent();
}

function flushInputs() {
  if (!ACT) return;
  ACT.lifts.forEach(function(lift, li) {
    lift.sets.forEach(function(set, si) {
      var wi = document.getElementById('wi-'+li+'-'+si);
      var ri = document.getElementById('ri-'+li+'-'+si);
      if (wi) set.w = parseFloat(wi.value) || '';
      if (ri) set.r = parseInt(ri.value)   || '';
    });
  });
  var nt = document.getElementById('session-note');
  if (nt) ACT.note = nt.value;
  saveD();
}

function rWkContent() {
  var day   = PROG.days[D.curDay];
  var clr   = colorCss(day.color);
  var last  = lastSession(day.id);

  var pencil = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  var trash  = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>';

  var liftsHtml = ACT.lifts.map(function(lift, li) {
    var allDone = lift.sets.every(function(s){ return s.done; });

    // last week chips
    var lwHtml = '';
    if (last) {
      var pl = last.lifts.find(function(x){ return x.name===lift.name; });
      if (pl) {
        var vs = pl.sets.filter(function(s){ return s.w&&s.r; });
        if (vs.length) {
          lwHtml = '<div class="lw-bar"><span class="lw-label">Last</span>'
            + vs.map(function(s){ return '<span class="lw-chip">'+s.w+'&times;'+s.r+'</span>'; }).join('')
            + '</div>';
        }
      }
    }

    var setRows = lift.sets.map(function(set, si) {
      var pre = (set.w && !set.done) ? ' pre' : '';
      var ckCls = 'ck' + (set.done?' on':'');
      var tick = set.done ? '<svg viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '';
      return '<div class="set-row'+(set.done?' done-row':'')+'">'+
        '<div class="set-num">'+(si+1)+'</div>'+
        '<input id="wi-'+li+'-'+si+'" class="si'+pre+'" type="number" inputmode="decimal" value="'+(set.w||'')+'" placeholder="\u2014" onchange="upSet('+li+','+si+',\'w\',this.value)" onfocus="this.select()">'+
        '<input id="ri-'+li+'-'+si+'" class="si" type="number" inputmode="numeric" value="'+(set.r||'')+'" placeholder="\u2014" onchange="upSet('+li+','+si+',\'r\',this.value)" onfocus="this.select()">'+
        '<button class="'+ckCls+'" onclick="togSet('+li+','+si+')">'+tick+'</button>'+
        '<button class="del-set-btn" onclick="delSet('+li+','+si+')" title="Remove set">'+trash+'</button>'+
        '</div>';
    }).join('');

    var doneTag = allDone ? '<span class="done-tag">&#10003; DONE</span>' : '';

    return '<div class="lift-block'+(allDone?' done-block':'')+'">'
      + '<div class="lift-hdr">'
      + '<div class="lift-hdr-left">'
      + '<div style="display:flex;align-items:center;gap:6px;">'
      + '<div class="lift-name" id="ln-'+li+'" onclick="editName('+li+')">'+esc(lift.name)+'</div>'
      + doneTag
      + '</div>'
      + (lift.scheme ? '<div class="lift-scheme">'+esc(lift.scheme)+'</div>' : '')
      + '</div>'
      + '<div class="lift-hdr-right">'
      + '<button class="icon-btn" onclick="editName('+li+')" title="Rename">'+pencil+'</button>'
      + '<button class="icon-btn danger" onclick="deleteLift('+li+')" title="Delete lift">'+trash+'</button>'
      + '</div>'
      + '</div>'
      + lwHtml
      + '<div class="set-header"><div></div><div class="set-col-lbl">WT LB</div><div class="set-col-lbl">REPS</div><div></div><div></div></div>'
      + setRows
      + '<button class="add-set-row" onclick="addSet('+li+')">+ SET</button>'
      + '</div>';
  }).join('');

  // session note
  var noteHtml = '<div class="session-note-wrap">'
    + '<div class="snote-label">SESSION NOTE</div>'
    + '<textarea id="session-note" rows="3" placeholder="How did it feel? Weight to hit next time? Anything to remember..." style="background:var(--plate);border:1px solid var(--chalk);border-radius:4px;color:var(--light);font-family:var(--font-body);font-size:14px;padding:10px 12px;width:100%;outline:none;resize:none;line-height:1.6;" onchange="upNote(this.value)" onblur="upNote(this.value)">'+esc(ACT.note||'')+'</textarea>'
    + '</div>';

  var addLiftHtml = '<button class="add-lift-row" onclick="addLift()">+ ADD LIFT</button>';

  document.getElementById('wkContent').innerHTML = noteHtml + liftsHtml + addLiftHtml;
}

function upSet(li, si, f, v) {
  if (!ACT || !ACT.lifts[li]) return;
  ACT.lifts[li].sets[si][f] = f==='w' ? (parseFloat(v)||'') : (parseInt(v)||'');
  saveD();
}

function upNote(v) {
  if (!ACT) return;
  ACT.note = v;
  saveD();
}

function togSet(li, si) {
  flushInputs();
  ACT.lifts[li].sets[si].done = !ACT.lifts[li].sets[si].done;
  saveD(); updProg(); rWkContent();
}

function addSet(li) {
  flushInputs();
  var lift = ACT.lifts[li];
  var last = lift.sets[lift.sets.length-1];
  lift.sets.push({ w: last?last.w:'', r:'', done:false });
  saveD(); rWkContent();
}

function delSet(li, si) {
  flushInputs();
  if (ACT.lifts[li].sets.length <= 1) { toast('NEED AT LEAST 1 SET'); return; }
  ACT.lifts[li].sets.splice(si, 1);
  saveD(); updProg(); rWkContent();
}

function addLift() {
  flushInputs();
  showPromptDialog('ADD LIFT', 'Lift name...', function(name) {
    if (!name || !name.trim()) return;
    ACT.lifts.push({ name:name.trim(), scheme:'', sets:[{w:'',r:'',done:false},{w:'',r:'',done:false}] });
    saveD(); updProg(); rWkContent();
    setTimeout(function(){ var c=document.getElementById('wkContent'); if(c) c.scrollTop=c.scrollHeight; }, 60);
  });
}

function deleteLift(li) {
  var name = ACT.lifts[li].name;
  showConfirmDialog('DELETE ' + name.toUpperCase() + '?', 'Removes this lift from the session.', function(ok) {
    if (!ok) return;
    ACT.lifts.splice(li, 1);
    saveD(); updProg(); rWkContent();
  });
}

function updProg() {
  if (!ACT) return;
  var all  = ACT.lifts.reduce(function(a,l){ return a.concat(l.sets); }, []);
  var done = all.filter(function(s){ return s.done; }).length;
  var bar  = document.getElementById('progBar');
  if (bar) bar.style.width = (all.length ? Math.round(done/all.length*100) : 0) + '%';
}

function editName(li) {
  flushInputs();
  var el = document.getElementById('ln-'+li);
  if (!el) return;
  var cur = ACT.lifts[li].name;
  el.outerHTML = '<input class="lift-name-inp" id="lni-'+li+'" value="'+esc(cur)+'" maxlength="40">';
  var inp = document.getElementById('lni-'+li);
  if (!inp) return;
  inp.focus(); inp.select();
  function commit() {
    var nv = inp.value.trim() || cur;
    ACT.lifts[li].name = nv;
    D.names[cur] = nv;
    saveD();
    inp.outerHTML = '<div class="lift-name" id="ln-'+li+'" onclick="editName('+li+')">'+esc(nv)+'</div>';
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
}

function finishWorkout() {
  flushInputs();
  var done = ACT.lifts.reduce(function(a,l){ return a+l.sets.filter(function(s){ return s.done; }).length; }, 0);
  if (!done) { toast('CHECK OFF AT LEAST ONE SET'); return; }
  D.sessions.push({
    id:    Date.now(),
    date:  new Date().toISOString().split('T')[0],
    dayId: ACT.dayId, label: ACT.label, type: ACT.type, color: ACT.color,
    note:  ACT.note || '',
    lifts: ACT.lifts.map(function(l){
      return { name:l.name, scheme:l.scheme, sets:l.sets.filter(function(s){ return s.done&&s.w&&s.r; }) };
    })
  });
  D.curDay = (D.curDay+1) % 6;
  ACT = null;
  saveD();
  toast('SESSION LOGGED');
  go('home');
}

function cancelWorkout() {
  showConfirmDialog('CANCEL SESSION?', 'Progress will be cleared.', function(ok) {
    if (ok) { ACT=null; saveD(); go('home'); }
  });
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
function rHistory() {
  var el   = document.getElementById('histContent');
  var sess = D.sessions.slice().reverse();
  if (!sess.length) {
    el.innerHTML = '<div class="es"><div class="es-icon">&#9866;</div><p>NO SESSIONS YET<br>GET TO WORK</p></div>';
    return;
  }
  el.innerHTML = sess.map(function(s) {
    var ts  = s.lifts.reduce(function(a,l){ return a+l.sets.length; }, 0);
    var tv  = s.lifts.reduce(function(a,l){ return a+l.sets.reduce(function(b,st){ return b+(st.w||0)*(st.r||0); },0); }, 0);
    var clr = s.color && COLOR_CSS[s.color] ? COLOR_CSS[s.color] : 'var(--smoke)';
    var ds  = new Date(s.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
    return '<div class="hist-card" style="border-left-color:'+clr+';" onclick="openSes('+s.id+')">'
      + '<div class="hist-meta"><div>'
      + '<div class="hist-date">'+ds+'</div>'
      + '<div class="hist-name" style="color:'+clr+';">'+esc(s.label)+'</div>'
      + '</div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--smoke)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>'
      + '<div class="hist-stats">'
      + '<div class="hist-stat"><strong>'+ts+'</strong> SETS</div>'
      + '<div class="hist-stat"><strong>'+Math.round(tv).toLocaleString()+'</strong> LB</div>'
      + '<div class="hist-stat"><strong>'+s.lifts.length+'</strong> LIFTS</div>'
      + '</div>'
      + (s.note ? '<div style="font-family:var(--font-body);font-size:12px;color:var(--smoke);margin-top:6px;font-style:italic;line-height:1.5;border-left:2px solid var(--chalk);padding-left:8px;">'+esc(s.note)+'</div>' : '')
      + '</div>';
  }).join('');
}

function openSes(id) {
  var s   = D.sessions.find(function(x){ return x.id==id; });
  if (!s) return;
  var clr = s.color && COLOR_CSS[s.color] ? COLOR_CSS[s.color] : 'var(--white)';
  var ds  = new Date(s.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  var html = '<div style="padding-right:36px;margin-bottom:14px;">'
    + '<div class="modal-session-date">'+ds+'</div>'
    + '<div class="modal-session-name" style="color:'+clr+';">'+esc(s.label)+'</div>'
    + '</div>'
    + (s.note ? '<div class="modal-session-note">'+esc(s.note)+'</div>' : '');
  s.lifts.forEach(function(l) {
    var vs   = l.sets.filter(function(st){ return st.w&&st.r; });
    var best = vs.length ? Math.max.apply(null, vs.map(function(st){ return Math.round(st.w*(1+st.r/30)); })) : 0;
    html += '<div class="modal-lift"><div class="modal-lift-name">'+esc(l.name)+'</div>';
    l.sets.forEach(function(st,i){
      html += '<div class="modal-set-row"><span>SET '+(i+1)+'</span>'
        +'<strong>'+st.w+'lb &times; '+st.r+'</strong>'
        +'<span>~'+Math.round(st.w*(1+st.r/30))+'lb 1RM</span></div>';
    });
    if (best) html += '<div class="modal-best">BEST EST. 1RM: '+best+'LB</div>';
    html += '</div>';
  });
  html += '<button class="btn-danger" onclick="delSes('+s.id+')">DELETE SESSION</button>';
  document.getElementById('sesModalBody').innerHTML = html;
  document.getElementById('sesModal').classList.add('open');
}

function delSes(id) {
  showConfirmDialog('DELETE SESSION?', 'This cannot be undone.', function(ok) {
    if (!ok) return;
    D.sessions = D.sessions.filter(function(s){ return s.id!=id; });
    saveD(); closeMod(); rHistory(); toast('DELETED');
  });
}
function closeMod() { document.getElementById('sesModal').classList.remove('open'); }

// ─── PROGRESS ────────────────────────────────────────────────────────────────
var selLift = null;
function rProgress() {
  var el = document.getElementById('progContent');
  var lm = {};
  D.sessions.forEach(function(s){ s.lifts.forEach(function(l){ lm[l.name]=true; }); });
  var names = Object.keys(lm);
  if (!names.length) {
    el.innerHTML = '<div class="es"><div class="es-icon">&#128200;</div><p>LOG SESSIONS TO<br>SEE YOUR GAINS</p></div>';
    return;
  }
  if (!selLift || !lm[selLift]) selLift = names[0];
  var sd = D.sessions
    .filter(function(s){ return s.lifts.some(function(l){ return l.name===selLift; }); })
    .map(function(s) {
      var l  = s.lifts.find(function(x){ return x.name===selLift; });
      var vs = l.sets.filter(function(st){ return st.w&&st.r; });
      if (!vs.length) return null;
      var b1  = Math.max.apply(null, vs.map(function(st){ return Math.round(st.w*(1+st.r/30)); }));
      var vol = vs.reduce(function(a,st){ return a+st.w*st.r; }, 0);
      var bw  = Math.max.apply(null, vs.map(function(st){ return st.w; }));
      return { date:s.date, b1:b1, vol:vol, bw:bw };
    }).filter(Boolean);

  var best1 = sd.length ? Math.max.apply(null, sd.map(function(d){ return d.b1; })) : 0;
  var bestW = sd.length ? Math.max.apply(null, sd.map(function(d){ return d.bw; })) : 0;

  var pills = '<div class="lift-pills">' + names.map(function(n) {
    var sh = n.replace('Barbell ','').replace('Dumbbell ','').replace('DB ','');
    return '<button class="lift-pill'+(n===selLift?' active':'')+'" onclick="pickLift(\''+n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">'+esc(sh)+'</button>';
  }).join('') + '</div>';

  var prbars = '<div class="pr-grid">'
    + '<div class="pr-block"><div class="pr-val">'+(best1?best1+'lb':'&mdash;')+'</div><div class="pr-lbl">Best Est. 1RM</div></div>'
    + '<div class="pr-block steel"><div class="pr-val" style="color:var(--steel);">'+(bestW?bestW+'lb':'&mdash;')+'</div><div class="pr-lbl">Best Weight</div></div>'
    + '</div>';

  var charts = sd.length >= 2
    ? '<div class="chart-block"><div class="chart-title">EST. 1RM OVER TIME</div>'+lChart(sd.map(function(d){return d.b1;}),sd.map(function(d){return d.date;}),'#ff4018')+'</div>'
    + '<div class="chart-block"><div class="chart-title">SESSION VOLUME (LB)</div>'+bChart(sd.map(function(d){return d.vol;}),sd.map(function(d){return d.date;}),'#4fa8c5')+'</div>'
    + '<div class="chart-block"><div class="chart-title">TOP WEIGHT PER SESSION</div>'+lChart(sd.map(function(d){return d.bw;}),sd.map(function(d){return d.date;}),'#a8e040')+'</div>'
    : '<div style="text-align:center;padding:32px;font-family:var(--font-mono);font-size:11px;color:var(--smoke);letter-spacing:.1em;">LOG 2+ SESSIONS WITH THIS LIFT TO SEE CHARTS</div>';

  el.innerHTML = pills + prbars + charts;
}
function pickLift(n) { selLift=n; rProgress(); }

function lChart(vals, labs, col) {
  var W=320,H=110,pL=44,pR=10,pT=8,pB=28,iW=W-pL-pR,iH=H-pT-pB;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1,n=vals.length;
  var pts=vals.map(function(v,i){ return {x:pL+(i/(n-1))*iW, y:pT+iH-((v-mn)/rng)*iH}; });
  var path=pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
  var area=path+' L'+pts[n-1].x.toFixed(1)+','+(pT+iH)+' L'+pts[0].x.toFixed(1)+','+(pT+iH)+' Z';
  var gid='g'+col.replace('#','');
  var yL=[mn,Math.round((mn+mx)/2),mx].map(function(v){
    var y=pT+iH-((v-mn)/rng)*iH;
    return '<text x="'+(pL-5)+'" y="'+(y+4)+'" text-anchor="end" fill="var(--smoke)" font-size="10" font-family="DM Mono">'+Math.round(v)+'</text>';
  }).join('');
  var step=Math.max(1,Math.floor(n/3));
  var xL=labs.map(function(l,i){
    if(i%step&&i!==n-1) return '';
    var x=pL+(i/(n-1))*iW;
    var d=new Date(l+'T12:00:00');
    return '<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" fill="var(--smoke)" font-size="10" font-family="DM Mono">'+d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})+'</text>';
  }).join('');
  return '<div class="cw"><svg class="ch" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'" stop-opacity=".25"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    +pts.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="'+col+'"/>'; }).join('')
    +yL+xL+'</svg></div>';
}

function bChart(vals, labs, col) {
  var W=320,H=110,pL=50,pR=10,pT=8,pB=28,iW=W-pL-pR,iH=H-pT-pB;
  var mx=Math.max.apply(null,vals)||1,n=vals.length;
  var bW=Math.max(4,(iW/n)*0.6);
  var bars=vals.map(function(v,i){
    var x=pL+(i/(n-1||1))*(iW-bW);
    var bH=(v/mx)*iH;
    return '<rect x="'+x.toFixed(1)+'" y="'+(pT+iH-bH).toFixed(1)+'" width="'+bW+'" height="'+bH.toFixed(1)+'" rx="1" fill="'+col+'" fill-opacity=".75"/>';
  }).join('');
  var yL=[0,Math.round(mx/2),mx].map(function(v){
    var y=pT+iH-(v/mx)*iH;
    var lbl=v>=1000?(v/1000).toFixed(1)+'k':v;
    return '<text x="'+(pL-5)+'" y="'+(y+4)+'" text-anchor="end" fill="var(--smoke)" font-size="10" font-family="DM Mono">'+lbl+'</text>';
  }).join('');
  var step=Math.max(1,Math.floor(n/3));
  var xL=labs.map(function(l,i){
    if(i%step&&i!==n-1) return '';
    var x=pL+(i/(n-1||1))*(iW-bW)+bW/2;
    var d=new Date(l+'T12:00:00');
    return '<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" fill="var(--smoke)" font-size="10" font-family="DM Mono">'+d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})+'</text>';
  }).join('');
  return '<div class="cw"><svg class="ch" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+bars+yL+xL+'</svg></div>';
}

// ─── CUSTOM DIALOGS ──────────────────────────────────────────────────────────
var _promptCb = null;
function showPromptDialog(title, placeholder, cb) {
  _promptCb = cb;
  document.getElementById('promptTitle').textContent = title;
  var inp = document.getElementById('promptInput');
  inp.placeholder = placeholder;
  inp.value = '';
  document.getElementById('promptDialog').classList.add('open');
  setTimeout(function(){ inp.focus(); }, 80);
}
function submitPromptDialog() {
  var val = document.getElementById('promptInput').value;
  document.getElementById('promptDialog').classList.remove('open');
  if (_promptCb) { _promptCb(val); _promptCb = null; }
}
function closePromptDialog() {
  document.getElementById('promptDialog').classList.remove('open');
  _promptCb = null;
}
document.getElementById('promptInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); submitPromptDialog(); }
});

var _confirmCb = null;
function showConfirmDialog(title, sub, cb) {
  _confirmCb = cb;
  var t = document.getElementById('confirmTitle');
  t.innerHTML = title + (sub ? '<div style="font-family:var(--font-mono);font-size:11px;color:var(--smoke);letter-spacing:.1em;margin-top:4px;">'+sub+'</div>' : '');
  document.getElementById('confirmDialog').classList.add('open');
}
function closeConfirmDialog(ok) {
  document.getElementById('confirmDialog').classList.remove('open');
  if (_confirmCb) { _confirmCb(ok); _confirmCb = null; }
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
rHome();
</script>
